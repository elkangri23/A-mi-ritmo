<style>
#ritmo-boceto{--paper:light-dark(#fbf8f1,#202824);--ink:light-dark(#172923,#f4f5eb);--edge:light-dark(#b5c2b5,#637669);--key:light-dark(#d7e9da,#354d3f);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
#ritmo-boceto .journey{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:640px;margin:auto}
#ritmo-boceto figure{margin:0;display:grid;justify-items:center;gap:8px;align-content:center}
#ritmo-boceto .phone{box-sizing:border-box;width:min(100%,245px);min-height:237px;background:var(--paper);border:1px solid var(--edge);border-radius:22px;padding:16px;display:grid;align-content:start;gap:12px}
#ritmo-boceto h3,#ritmo-boceto p{margin:0}
#ritmo-boceto .mock-key,#ritmo-boceto button{background:var(--key);color:var(--ink);border:0;border-radius:10px;padding:8px;font:inherit;text-align:center}
#ritmo-boceto .script{border-top:1px solid var(--edge);padding-top:8px}
#ritmo-boceto .cue{border-left:3px solid var(--edge);padding-left:9px;min-height:80px}
#ritmo-boceto .watch{box-sizing:border-box;background:var(--paper);border:1px solid var(--edge);border-radius:50%;width:218px;height:218px;padding:24px 15px;display:grid;place-content:center;text-align:center;gap:8px}
#ritmo-boceto .keys{display:flex;justify-content:center;gap:4px}
#ritmo-boceto button{min-width:44px;min-height:44px;padding:4px}
#ritmo-boceto button:disabled{opacity:.45}
@media(max-width:525px){#ritmo-boceto .journey{grid-template-columns:1fr}}
</style>
<div id="ritmo-boceto" class="viz-dotted-background">
  <div class="journey">
    <figure>
      <div class="phone">
        <h3>Mis guiones</h3>
        <div class="mock-key">＋ Nuevo guion</div>
        <div class="script"><strong>Presentación del proyecto</strong><p>3 secciones</p></div>
        <div class="script">Ensayo de bienvenida</div>
      </div>
      <figcaption>Mis guiones</figcaption>
    </figure>
    <figure>
      <div class="phone">
        <h3>Presentación del proyecto</h3>
        <div class="mock-key"><b>N</b>　<i>C</i>　<u>S</u>　Color</div>
        <div><strong>Bienvenida</strong><p>Gracias por venir. Hoy quiero compartir <u>tres ideas</u>.</p></div>
        <div class="script">＋ Añadir sección</div>
        <div class="mock-key">Abrir lectura</div>
      </div>
      <figcaption>Editor del móvil</figcaption>
    </figure>
    <figure>
      <div class="phone">
        <h3>Presentación del proyecto</h3>
        <div class="cue">
          <strong data-title>Bienvenida</strong>
          <p data-copy>Gracias por venir. Hoy quiero compartir tres ideas.</p>
        </div>
        <p data-status aria-live="polite">En pausa · 1,0×</p>
        <div class="mock-key">Secciones　·　Ajustes</div>
      </div>
      <figcaption>Lectura en el móvil</figcaption>
    </figure>
    <figure>
      <div class="watch">
        <strong data-title>Bienvenida</strong>
        <div class="keys">
          <button type="button" data-action="previous" aria-label="Sección anterior">|◀</button>
          <button type="button" data-action="play" aria-label="Reproducir">▶</button>
          <button type="button" data-action="next" aria-label="Sección siguiente">▶|</button>
        </div>
        <div class="keys">
          <button type="button" data-action="slower" aria-label="Más lento">−</button>
          <span data-speed style="align-self:center">1,0×</span>
          <button type="button" data-action="faster" aria-label="Más rápido">＋</button>
        </div>
      </div>
      <figcaption>Mando del Galaxy Watch7</figcaption>
    </figure>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('ritmo-boceto');
  const sections = [
    ['Bienvenida', 'Gracias por venir. Hoy quiero compartir tres ideas.'],
    ['Demostración', 'Empecemos con un ejemplo sencillo.'],
    ['Cierre', 'Gracias por escuchar. Ahora podemos pasar a las preguntas.']
  ];
  let section = 0;
  let speed = 10;
  let playing = false;
  const controls = {
    previous: () => { section--; },
    next: () => { section++; },
    play: () => { playing = !playing; },
    slower: () => { speed--; },
    faster: () => { speed++; }
  };
  const buttons = Object.fromEntries([...root.querySelectorAll('button')].map(button => [button.dataset.action, button]));
  function render() {
    const [title, copy] = sections[section];
    const rate = (speed / 10).toFixed(1).replace('.', ',') + '×';
    root.querySelectorAll('[data-title]').forEach(element => { element.textContent = title; });
    root.querySelector('[data-copy]').textContent = copy;
    root.querySelector('[data-status]').textContent = (playing ? 'En marcha' : 'En pausa') + ' · ' + rate;
    root.querySelector('[data-speed]').textContent = rate;
    buttons.play.textContent = playing ? 'Ⅱ' : '▶';
    buttons.play.setAttribute('aria-label', playing ? 'Pausar' : 'Reproducir');
    buttons.previous.disabled = section === 0;
    buttons.next.disabled = section === sections.length - 1;
    buttons.slower.disabled = speed === 5;
    buttons.faster.disabled = speed === 20;
  }
  Object.entries(buttons).forEach(([action, button]) => {
    button.addEventListener('click', () => {
      controls[action]();
      render();
    });
  });
  render();
})();
</script>
